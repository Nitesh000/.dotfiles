# ~/.config/kitty/kitty.conf
# reload: cmd+r (below) — kitty's default is ctrl+cmd+,

# --- font ---
font_family        MesloLGLDZ Nerd Font
bold_font          MesloLGLDZ Nerd Font
italic_font        MesloLGLDZ Nerd Font
bold_italic_font   MesloLGLDZ Nerd Font
font_size          14
macos_thicken_font 0.4

# --- cursor ---
cursor_shape          block
cursor_blink_interval 0
shell_integration     enabled no-cursor

# --- window ---
background_opacity        0.65
background_blur           20
hide_window_decorations   titlebar-only
macos_show_window_title_in none
window_padding_width      5
placement_strategy        center
confirm_os_window_close   0
macos_quit_when_last_window_closed yes
update_check_interval     24

# needed for splits
enabled_layouts splits,stack

# --- simple keybinds ---
map cmd+r load_config_file
# no kitty equivalent for inspector:toggle
# closest: map cmd+i debug_config

# --- tmux-style prefix (cmd+b) ---
map cmd+b>r load_config_file
map cmd+b>x close_window
map cmd+b>c new_tab
map cmd+b>n new_os_window

# tab nav
map cmd+b>1 goto_tab 1
map cmd+b>2 goto_tab 2
map cmd+b>3 goto_tab 3
map cmd+b>4 goto_tab 4
map cmd+b>5 goto_tab 5
map cmd+b>6 goto_tab 6
map cmd+b>7 goto_tab 7
map cmd+b>8 goto_tab 8
map cmd+b>9 goto_tab 9

# splitting
map cmd+b>\ launch --location=vsplit --cwd=current
map cmd+b>- launch --location=hsplit --cwd=current
map cmd+b>e reset_window_sizes

# split nav
map cmd+b>h neighboring_window left
map cmd+b>j neighboring_window down
map cmd+b>k neighboring_window up
map cmd+b>l neighboring_window right

# --- colors ---
background      #000000
foreground      #ffffff
cursor          #ffffff
cursor_text_color #F81CE5

color0  #000000
color1  #fe0100
color2  #33ff00
color3  #feff00
color4  #0066ff
color5  #cc00ff
color6  #00ffff
color7  #d0d0d0
color8  #808080
color9  #fe0100
color10 #33ff00
color11 #feff00
color12 #0066ff
color13 #cc00ff
color14 #00ffff
color15 #ffffff
